# Render blueprint for the MediScan AI backend.
#
# Creates TWO web services:
#   1. mediscan-api     — Node/Express API (the frontend on Netlify talks to this)
#   2. mediscan-vision  — Python YOLO / OpenCV fault detector (X-ray marking)
#
# The API auto-discovers the vision service URL through the VISION_URL env var,
# so no manual wiring is needed.

services:
  # ---------------- Main API (Node) ----------------
  - type: web
    name: mediscan-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (never commit keys to git):
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_MODELS
        sync: false
      - key: GROQ_VISION_MODELS
        sync: false
      # Point the API at the Python vision service over Render's private network.
      # fromService hostport injects an internal "host:port" (plain HTTP, port
      # 10000) reachable only between services in the SAME workspace & region.
      # yolo.js normalizes it to http://host:port. If private networking isn't
      # available, override VISION_URL in the dashboard with the public URL
      # (https://mediscan-vision.onrender.com) — the code accepts full URLs too.
      - key: VISION_URL
        fromService:
          name: mediscan-vision
          type: web
          property: hostport

  # ---------------- Vision service (Python) ----------------
  # NOTE: Render has NO GPU instances. YOLOv8 runs on CPU here — that's fine
  # (the model is only 22MB), just slower than a local GPU. torch needs RAM,
  # so use at least "standard" (2 GB); free/starter (512 MB) can OOM and
  # crash-loop. If it fails anyway, the API degrades to AI-vision marking.
  - type: web
    name: mediscan-vision
    runtime: python
    plan: standard
    buildCommand: pip install -r server/requirements-vision.txt
    startCommand: uvicorn vision_service:app --host 0.0.0.0 --port $PORT --app-dir server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0